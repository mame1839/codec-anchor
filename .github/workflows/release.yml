name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  RELEASE_CERT_SHA256: d797d242717368f2053ee3fc63c192f96edf117206d40b9bed1e7bf04bf05b36

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: タグと版を決める
        id: version
        run: |
          . module/version.sh
          if [[ ! "$GITHUB_REF_NAME" =~ ^${CA_APP_TAG_PREFIX}[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "タグ名が ${CA_APP_TAG_PREFIX}<major>.<minor>.<patch> ではない: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          git fetch --no-tags --force origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "このタグは main に含まれないコミットを指している。" >&2
            exit 1
          fi
          version="${GITHUB_REF_NAME#"$CA_APP_TAG_PREFIX"}"
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "code=$(ca_version_code "$version")" >> "$GITHUB_OUTPUT"

      - name: 署名鍵を復元
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 が未設定。署名済み APK を作れないので中止する。" >&2
            exit 1
          fi
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/release.jks

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: ビルド
        env:
          CA_STORE_PASSWORD: ${{ secrets.CA_STORE_PASSWORD }}
          CA_KEY_ALIAS: ${{ secrets.CA_KEY_ALIAS }}
          CA_KEY_PASSWORD: ${{ secrets.CA_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -PversionName="${{ steps.version.outputs.name }}" \
            -PversionCode="${{ steps.version.outputs.code }}" \
            --stacktrace

      - name: 署名鍵を消す
        if: always()
        run: rm -f keystore/release.jks

      - name: 署名を確認
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$apk" ]; then
            echo "$apk が無い。署名設定が付かなかった可能性がある。" >&2
            ls -la app/build/outputs/apk/release >&2
            exit 1
          fi
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          apksigner="$(find "$sdk/build-tools" -maxdepth 2 -name apksigner | sort -V | tail -1)"
          if [ -z "$apksigner" ]; then
            echo "apksigner が見つからない: $sdk/build-tools" >&2
            exit 1
          fi
          "$apksigner" verify --print-certs "$apk" | tee certs.txt
          if ! grep -q "certificate SHA-256 digest: $RELEASE_CERT_SHA256" certs.txt; then
            echo "署名証明書がリリース鍵と一致しない。" >&2
            exit 1
          fi

      - name: APK を並べる
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/CodecAnchor-${GITHUB_REF_NAME}.apk"
          ls -la dist

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          files: dist/*.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
