name: release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      CA_STORE_PASSWORD: ${{ secrets.CA_STORE_PASSWORD }}
      CA_KEY_ALIAS: ${{ secrets.CA_KEY_ALIAS }}
      CA_KEY_PASSWORD: ${{ secrets.CA_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - name: 署名鍵の有無を確認
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 が未設定。署名済み APK を作れないので中止する。" >&2
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: 署名鍵を復元
        run: |
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/release.jks

      - name: ビルド
        run: |
          version="${GITHUB_REF_NAME#v}"
          ./gradlew assembleRelease \
            -PversionName="$version" \
            -PversionCode="${{ github.run_number }}" \
            --stacktrace

      - name: APK を並べる
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/CodecAnchor-${GITHUB_REF_NAME}.apk"
          ls -la dist

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*.apk
          generate_release_notes: true
