name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      # 署名鍵は復元しない。ここの release は未署名で、構成が壊れていないかだけを見る
      # (本番鍵で署名した APK を作業中のブランチから配ってしまわないため)。
      - name: ビルドと lint
        run: ./gradlew assembleDebug assembleRelease :app:lintRelease --stacktrace

      - name: APK を保存
        uses: actions/upload-artifact@v7
        with:
          name: apk
          path: app/build/outputs/apk/*/*.apk
          if-no-files-found: error

      - name: lint の結果を保存
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint
          path: app/build/reports/lint-results-release.*
          if-no-files-found: ignore
