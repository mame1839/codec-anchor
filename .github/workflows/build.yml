name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: ビルドと lint
        run: ./gradlew assembleDebug assembleRelease :app:lintRelease --stacktrace

      - name: APK を保存
        uses: actions/upload-artifact@v7
        with:
          name: apk
          path: app/build/outputs/apk/*/*.apk
          if-no-files-found: error

      - name: lint の結果を保存
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint
          path: app/build/reports/lint-results-release.*
          if-no-files-found: ignore

  shell-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: モジュールのシェルスクリプトを検証する
        run: |
          bash module/test/patch_xml_test.sh
          bash module/test/module_test.sh

  dsp-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: EQ のオフラインハーネスをビルドする
        run: cmake -S app/src/main/cpp/test -B build/ca_eq_test && cmake --build build/ca_eq_test --parallel

      - name: EQ のオフラインハーネスを走らせる
        run: ./build/ca_eq_test/ca_eq_test
