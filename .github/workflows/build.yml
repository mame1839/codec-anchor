name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      CA_STORE_PASSWORD: ${{ secrets.CA_STORE_PASSWORD }}
      CA_KEY_ALIAS: ${{ secrets.CA_KEY_ALIAS }}
      CA_KEY_PASSWORD: ${{ secrets.CA_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: 署名鍵を復元
        if: env.KEYSTORE_BASE64 != ''
        run: |
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/release.jks

      - name: ビルド
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: APK を保存
        uses: actions/upload-artifact@v7
        with:
          name: apk
          path: app/build/outputs/apk/*/*.apk
          if-no-files-found: error
